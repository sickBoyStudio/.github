name: 🚨 저작권 침해 신고
description: 우리 코드·에셋이 허락 없이 쓰인 것을 발견했어요
title: "[침해 신고] "
labels: ["침해 신고"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **이 레포가 공개(public) 레포라면 여기 올리지 말고** 오너나 운영진에게 직접 연락하세요.
        증거는 지워지기 전에 먼저 남겨 주세요. → [저작권 침해 대응](https://github.com/sickBoyStudio/.github/blob/main/policies/infringement-response.md)
  - type: dropdown
    id: type
    attributes:
      label: 어떤 침해인가요
      options:
        - 조직 안 — 다른 레포나 멤버가 허락 없이 가져감
        - Roblox — 우리 게임을 복제한 게임, 무단 업로드된 에셋
        - GitHub — 우리 코드가 다른 레포에 올라감
        - 기타 플랫폼
        - 우리가 침해했다는 신고를 받음
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 우리 원본
      description: 파일 경로, 처음 들어간 커밋 해시와 날짜, PR 링크
    validations:
      required: true
  - type: textarea
    id: infringing
    attributes:
      label: 침해물
      description: URL, Place ID, Universe ID, 에셋 ID, 레포 링크, 제작자 프로필
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 증거
      description: 날짜가 보이는 스크린샷·영상, 원본과 나란히 놓은 비교 자료를 첨부하세요
    validations:
      required: true
  - type: textarea
    id: found
    attributes:
      label: 발견 경위
      placeholder: 언제, 어떻게 알게 되었는지
