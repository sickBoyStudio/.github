name: 프로젝트 참여
description: 역할과 작업 범위를 제안합니다.
title: '[프로젝트 참여] '
body:
- type: markdown
  attributes:
    value: 이 이슈는 공개될 수 있습니다. 개인정보, 계약·정산 원본, 비밀정보와 보안 취약점은 첨부하지 마세요.
- type: textarea
  id: area
  attributes:
    label: 관심 역할과 작업
  validations:
    required: true
- type: textarea
  id: portfolio
  attributes:
    label: 공개 가능한 작업물
    description: 공개 링크만 작성해 주세요.
  validations:
    required: false
- type: textarea
  id: availability
  attributes:
    label: 참여 가능 범위
    description: 무리한 시간 약속 대신 가능한 일정과 범위를 적습니다.
  validations:
    required: false
- type: markdown
  attributes:
    value: 작업 전에 범위·검수·보상·권리를 합의합니다. 신청만으로 권한이나 수익 배분이 확정되지 않습니다. [참여 안내](https://github.com/sickBoyStudio/.github/blob/main/CONTRIBUTING.md)
