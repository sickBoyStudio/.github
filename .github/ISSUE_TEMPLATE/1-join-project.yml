name: 🤝 공동제작 참여 신청
description: 이 게임을 같이 만들고 싶어요
title: "[참여 신청] "
labels: ["참여 신청"]
body:
  - type: markdown
    attributes:
      value: |
        오너가 신청을 받아 주면 이 레포에 쓰기 권한이 생깁니다.
        첫 작업 PR이 merge된 뒤 `CONTRIBUTORS.yml` 등록 PR을 보내면 **게임 수익의 5%** 가 제안됩니다.
        → [공동제작 참여 가이드](https://github.com/sickBoyStudio/.github/blob/main/CONTRIBUTING.md)
  - type: dropdown
    id: area
    attributes:
      label: 맡고 싶은 일
      multiple: true
      options:
        - 프로그래밍
        - 맵·레벨 디자인
        - 3D 모델링
        - 애니메이션
        - UI·그래픽
        - 사운드
        - 기획·밸런스
        - QA·테스트
        - 기타
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 구체적으로 하고 싶은 작업
      placeholder: 예) 2층 실험실 맵을 만들고 조명을 손보고 싶어요
    validations:
      required: true
  - type: textarea
    id: portfolio
    attributes:
      label: 보여 줄 수 있는 작업물
      description: 다른 레포, 로블록스 게임, 영상, 포트폴리오 링크
  - type: input
    id: roblox
    attributes:
      label: Roblox 프로필 링크
      placeholder: https://www.roblox.com/users/123456789/profile
    validations:
      required: true
  - type: dropdown
    id: time
    attributes:
      label: 일주일에 쓸 수 있는 시간
      options:
        - 5시간 미만
        - 5~10시간
        - 10~20시간
        - 20시간 이상
    validations:
      required: true
  - type: checkboxes
    id: agree
    attributes:
      label: 확인
      options:
        - label: "[운영 규칙](https://github.com/sickBoyStudio/.github/blob/main/GOVERNANCE.md), [수익 분배 규칙](https://github.com/sickBoyStudio/.github/blob/main/policies/revenue-share.md), [저작권과 사용 허가](https://github.com/sickBoyStudio/.github/blob/main/policies/copyright-and-licensing.md)를 읽었습니다"
          required: true
        - label: 만 19세 미만이라면 기여자 등록 때 보호자 동의가 필요하다는 것을 압니다
