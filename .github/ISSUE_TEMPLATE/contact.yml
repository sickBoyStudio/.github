name: 연락 경로 요청
description: 민감한 내용을 제외하고 비공개 연락 경로만 요청합니다.
title: '[연락 경로 요청] '
body:
- type: markdown
  attributes:
    value: 이 이슈는 공개될 수 있습니다. 개인정보, 계약·정산 원본, 비밀정보와 보안 취약점은 첨부하지 마세요.
- type: markdown
  attributes:
    value: 이 양식에는 증거·당사자 이름·이메일·피해 내용·계약 정보를 적지 마세요. 운영진이 비공개 전달 경로를 안내하기 전에는 상세 자료를
      보내지 마세요. 취약점은 SECURITY.md의 비공개 보안 신고를 이용해 주세요.
- type: checkboxes
  id: request
  attributes:
    label: 요청
    options:
    - label: 운영진이 확인한 비공개 연락 경로 안내를 요청합니다.
      required: true
