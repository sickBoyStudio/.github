name: 🛠️ 제작 작업
description: 작게 나누고, 완료 기준을 정하고, 함께 만들어요.
title: '[작업] '
labels:
- 작업
body:
- type: markdown
  attributes:
    value: 큰 기능은 작은 퀘스트로 나눠 주세요. 아직 아이디어를 모으는 단계라면 Discussions, 구현할 일이 정해졌다면 이 양식!
- type: textarea
  id: goal
  attributes:
    label: 이번 작업의 목표
    placeholder: '예: 플레이어가 문을 열고 닫을 수 있게 만들기'
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 작업 범위와 제외할 것
    placeholder: '포함: 문 하나의 상호작용 / 제외: 잠금·열쇠 시스템'
  validations:
    required: true
- type: textarea
  id: done
  attributes:
    label: 완료 기준
    placeholder: '- [ ] 두 명이 접속한 서버에서 문 상태가 같아요

      - [ ] 모바일에서도 조작할 수 있어요'
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: 먼저 필요한 것·관련 링크
    description: 선행 작업, 사용할 에셋, 관련 이슈를 적어 주세요.
- type: textarea
  id: verify
  attributes:
    label: 어떻게 확인하나요?
    placeholder: 테스트 장소와 순서, 결과를 확인하는 방법
  validations:
    required: true
