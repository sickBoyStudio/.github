name: 사용 허가 요청
description: 기존 라이선스로 허용되지 않은 이용을 요청합니다.
title: '[사용 허가 요청] '
body:
- type: markdown
  attributes:
    value: 이 이슈는 공개될 수 있습니다. 개인정보, 계약·정산 원본, 비밀정보와 보안 취약점은 첨부하지 마세요.
- type: textarea
  id: target
  attributes:
    label: 대상 파일·버전
    description: 공개 자료만 특정하고 비공개 원본을 첨부하지 마세요.
  validations:
    required: true
- type: textarea
  id: purpose
  attributes:
    label: 사용할 프로젝트와 목적
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: 수정·상업 이용·재배포 범위
  validations:
    required: true
- type: textarea
  id: terms
  attributes:
    label: 기간·대가·크레딧 제안
  validations:
    required: true
- type: markdown
  attributes:
    value: 기존 라이선스로 허용된 사용은 그 조건을 따릅니다. 별도 허가가 필요한 사용은 권한 있는 권리자의 명시적 승인 전 시작하지 않습니다.
