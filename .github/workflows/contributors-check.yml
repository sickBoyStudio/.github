# 재사용 워크플로 — 각 게임 레포에서 호출합니다.
# 호출 방법: templates/workflows/contributors-check.yml 을 레포의 .github/workflows/ 에 복사하세요.
name: 기여자 설정 검사

on:
  workflow_call:
    inputs:
      file:
        description: 기여자 설정 파일 경로
        type: string
        default: CONTRIBUTORS.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 조직 규칙 검사기 가져오기
        uses: actions/checkout@v4
        with:
          repository: sickBoyStudio/.github
          path: .sbs-policy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml==6.0.2

      - name: CONTRIBUTORS.yml 검사
        env:
          FILE: ${{ inputs.file }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--file "$FILE" --actor "$ACTOR")
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:$FILE" 2>/dev/null; then
            git show "$BASE_SHA:$FILE" > "$RUNNER_TEMP/base.yml"
            args+=(--base "$RUNNER_TEMP/base.yml")
          fi
          python .sbs-policy/scripts/check_contributors.py "${args[@]}"
