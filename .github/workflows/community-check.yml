name: 커뮤니티 양식 검사
on:
  pull_request:
    paths:
      - .github/DISCUSSION_TEMPLATE/**
      - .github/ISSUE_TEMPLATE/**
      - .github/labels.yml
      - .github/workflows/community-check.yml
      - scripts/check_community.py
      - scripts/sync_labels.py
      - tests/test_community.py
  push:
    branches: [main]
    paths:
      - .github/DISCUSSION_TEMPLATE/**
      - .github/ISSUE_TEMPLATE/**
      - .github/labels.yml
      - .github/workflows/community-check.yml
      - scripts/check_community.py
      - scripts/sync_labels.py
      - tests/test_community.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml==6.0.2
      - run: python scripts/check_community.py
      - run: python -m unittest discover -s tests -v
