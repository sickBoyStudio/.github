name: 검사기 자체 테스트

on:
  push:
    branches: [main]
    paths: [scripts/**, tests/**, templates/CONTRIBUTORS.yml, .github/workflows/self-test.yml]
  pull_request:
    paths: [scripts/**, tests/**, templates/CONTRIBUTORS.yml, .github/workflows/self-test.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml==6.0.2
      - run: python -m unittest discover -s tests -v
