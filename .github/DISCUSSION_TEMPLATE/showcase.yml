title: '[작품] '
labels:
- '소통: 작품 자랑'
body:
- type: markdown
  attributes:
    value: 🎮 문 하나, 발소리 하나, 10초짜리 테스트도 작품입니다. 오늘 만든 걸 보여 주세요! 작은 작업도 환영합니다. 공개해도 되는 내용만 올려 주세요. 미공개 코드·개인 연락처·정산
      자료는 프로젝트의 비공개 경로에서 다룹니다.
- type: input
  id: pitch
  attributes:
    label: 어떤 작업인가요?
    placeholder: '예: 불이 꺼질 때만 움직이는 NPC 프로토타입'
  validations:
    required: true
- type: dropdown
  id: stage
  attributes:
    label: 현재 단계
    options:
    - 아이디어·콘셉트
    - 제작 중 / WIP
    - 프로토타입
    - 플레이테스트
    - 완성·업데이트
  validations:
    required: true
- type: textarea
  id: show
  attributes:
    label: 화면·영상·플레이 링크
    description: 이미지를 끌어다 놓거나 공개 가능한 링크를 붙여 주세요. 콘셉트와 실제 구현을 구분해 주세요.
  validations:
    required: true
- type: textarea
  id: detail
  attributes:
    label: 어떤 부분을 만들었나요?
    placeholder: 내가 맡은 부분 / 재미있었던 구현 / 아직 작업 중인 부분
  validations:
    required: true
- type: dropdown
  id: feedback
  attributes:
    label: 어떤 반응을 원하나요?
    options:
    - 가볍게 구경하고 응원해 주세요
    - 특정 부분의 피드백이 필요해요
    - 플레이테스트를 부탁해요
  validations:
    required: true
- type: textarea
  id: ask
  attributes:
    label: 특히 봐주면 좋은 부분
    description: '예: 모바일에서 버튼이 잘 보이나요? 첫 번째 퍼즐의 힌트가 충분한가요?'
- type: textarea
  id: credits
  attributes:
    label: 함께 만든 사람·사용한 자료
    description: 공동 작업자와 외부 코드·에셋의 출처를 적어 주세요.
