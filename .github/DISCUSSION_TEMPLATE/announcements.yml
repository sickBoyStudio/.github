title: '[공지] '
labels:
- '소통: 공지'
body:
- type: markdown
  attributes:
    value: 📣 바뀌는 내용과 필요한 행동을 한눈에. 기존 정책의 변경 절차는 [운영 규칙](https://github.com/sickBoyStudio/.github/blob/main/GOVERNANCE.md)을
      따릅니다.
- type: dropdown
  id: kind
  attributes:
    label: 공지 종류
    options:
    - 운영 안내
    - 개발·업데이트 소식
    - 플레이테스트 안내
    - 일정 안내
    - 정책 변경 안내
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: 세 줄 요약
    placeholder: 무엇이 바뀌나요? 누구에게 해당하나요? 무엇을 하면 되나요?
  validations:
    required: true
- type: input
  id: when
  attributes:
    label: 적용일·마감
    placeholder: YYYY-MM-DD HH:mm KST
    description: 날짜·시간·시간대를 명시해 주세요. 일정이 없으면 상시 또는 해당 없음.
  validations:
    required: true
- type: textarea
  id: detail
  attributes:
    label: 자세한 내용
  validations:
    required: true
- type: textarea
  id: action
  attributes:
    label: 함께 해주세요
    description: 참여 방법, 확인할 링크, 문의할 곳. 별도 행동이 없으면 읽어두기만 하면 됩니다.
