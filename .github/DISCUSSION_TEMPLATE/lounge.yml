title: '[라운지] '
labels:
- '소통: 라운지'
body:
- type: markdown
  attributes:
    value: 👋 처음이면 인사부터, 익숙하면 오늘의 개발 이야기부터. 완성된 포트폴리오가 없어도 괜찮아요.
- type: dropdown
  id: kind
  attributes:
    label: 오늘의 이야기
    options:
    - 처음 인사해요
    - 개발 일상·잡담
    - 아이디어 한 조각
    - 자료·팁 공유
  validations:
    required: true
- type: textarea
  id: story
  attributes:
    label: 들려주고 싶은 이야기
    placeholder: 자기소개라면 닉네임 / 관심 분야 / 만들어 보고 싶은 게임을 알려 주세요. 잡담이라면 자유롭게!
  validations:
    required: true
- type: textarea
  id: links
  attributes:
    label: 보여주고 싶은 링크
    description: 공개 포트폴리오, 게임, 참고 자료. 다른 사람의 작업이면 출처를 함께 적어 주세요.
- type: textarea
  id: next
  attributes:
    label: 같이 이야기해 보고 싶은 것
    description: 배워 보고 싶은 것, 함께 해보고 싶은 작은 작업, 요즘의 고민.
- type: markdown
  attributes:
    value: 작은 작업도 환영합니다. 공개해도 되는 내용만 올려 주세요. 미공개 코드·개인 연락처·정산 자료는 프로젝트의 비공개 경로에서 다룹니다.
