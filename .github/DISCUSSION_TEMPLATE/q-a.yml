title: '[질문] '
labels:
- question
body:
- type: markdown
  attributes:
    value: 🙋 혼자 디버깅하다 막혔다면, 여기서 같이 풀어요. 작은 작업도 환영합니다. 공개해도 되는 내용만 올려 주세요. 미공개 코드·개인 연락처·정산 자료는 프로젝트의 비공개 경로에서 다룹니다.
- type: dropdown
  id: topic
  attributes:
    label: 어디에서 막혔나요?
    options:
    - Luau·스크립트
    - Studio·퍼블리시
    - 맵·조명
    - 모델링·애니메이션
    - UI·UX
    - 사운드
    - 기획·밸런스
    - Git·Rojo·협업
    - 기타
  validations:
    required: true
- type: textarea
  id: goal
  attributes:
    label: 만들고 싶은 결과
    placeholder: '예: E키를 누른 플레이어에게만 상점 UI가 열리게 하고 싶어요.'
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: 실제로 일어난 일
    placeholder: 기대했던 동작과 실제 동작, Output 오류를 알려 주세요.
  validations:
    required: true
- type: textarea
  id: tried
  attributes:
    label: 여기까지 해봤어요
    description: 시도한 방법·참고한 문서·관련 코드를 적어 주세요. 코드는 ```lua 코드 블록으로 감싸면 읽기 좋아요.
  validations:
    required: true
- type: textarea
  id: repro
  attributes:
    label: 재현 방법과 환경
    description: Studio/실제 게임, 서버/클라이언트, PC/모바일, 최소 재현 순서. 공개 가능한 스크린샷도 좋아요.
- type: markdown
  attributes:
    value: 해결됐다면 도움이 된 답을 **Mark as answer**로 채택하고, 최종 해결 방법을 짧게 남겨 주세요. 다음 사람이 같은 벽을 덜 만납니다. 한 글에는 한 가지 질문!
