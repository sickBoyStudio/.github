title: "[질문] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        목표, 시도한 방법과 오류를 적어 주세요. 개인정보·키·쿠키는 제거합니다.
        처음 시작한다면 [로블록스 처음 만들어 보기](https://github.com/sickBoyStudio/.github/blob/main/guides/getting-started.md)도 같이 보세요.
  - type: dropdown
    id: topic
    attributes:
      label: 분야
      options:
        - 스크립트 (Luau)
        - Studio 사용법
        - 맵·모델링·애니메이션
        - UI
        - 퍼블리시·공개 설정
        - 수익화·DevEx
        - 저작권·라이선스
        - Rojo·Git·협업
        - 기타
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 하고 싶은 것
      placeholder: 예) E키를 누르면 문이 열리게 하고 싶어요
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 해 본 것
      description: 코드는 그대로 붙여 넣으세요. 자동으로 코드 블록이 됩니다.
      render: lua
  - type: textarea
    id: result
    attributes:
      label: 결과와 에러
      description: Output 창의 빨간 에러 메시지를 그대로 복사하고, 필요하면 스크린샷을 첨부하세요.
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: 로블록스 개발 경험
      options:
        - 이번이 처음
        - 몇 주 정도
        - 몇 달 이상
        - 1년 이상
