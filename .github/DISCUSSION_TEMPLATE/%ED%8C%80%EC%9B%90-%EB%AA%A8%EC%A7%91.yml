title: "[팀원 모집] "
body:
  - type: markdown
    attributes:
      value: |
        같이 만들 사람을 찾는 글입니다. 참여가 정해지면 해당 게임 레포에서 [공동제작 참여 가이드](https://github.com/sickBoyStudio/.github/blob/main/CONTRIBUTING.md)대로 진행합니다.
        기여자로 인정되면 **게임 수익의 5%** 부터 시작합니다. ([수익 분배 규칙](https://github.com/sickBoyStudio/.github/blob/main/policies/revenue-share.md))
  - type: dropdown
    id: kind
    attributes:
      label: 글 종류
      options:
        - 팀원을 찾아요 (게임 오너)
        - 팀에 들어가고 싶어요
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: 게임 / 나 소개
      description: 오너라면 게임의 장르, 진행 상황, 목표 출시 시기. 참여 희망자라면 할 수 있는 것과 작업물.
    validations:
      required: true
  - type: dropdown
    id: roles
    attributes:
      label: 필요한 역할 / 맡고 싶은 역할
      multiple: true
      options:
        - 프로그래밍
        - 맵·레벨 디자인
        - 3D 모델링
        - 애니메이션
        - UI·그래픽
        - 사운드
        - 기획·밸런스
        - QA·테스트
    validations:
      required: true
  - type: dropdown
    id: time
    attributes:
      label: 기대하는 / 쓸 수 있는 시간 (주당)
      options:
        - 5시간 미만
        - 5~10시간
        - 10~20시간
        - 20시간 이상
  - type: checkboxes
    id: rules
    attributes:
      label: 확인
      options:
        - label: 수익 금액이나 개인 연락처는 이 공개 글에 쓰지 않겠습니다
          required: true
