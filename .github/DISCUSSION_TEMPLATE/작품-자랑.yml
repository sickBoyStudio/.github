title: "[작품] "
body:
  - type: markdown
    attributes:
      value: 만든 것을 자랑해 주세요. 완성작이 아니어도, 작은 실험이어도 좋습니다.
  - type: input
    id: link
    attributes:
      label: 게임 링크 또는 영상
      placeholder: https://www.roblox.com/games/...
  - type: textarea
    id: about
    attributes:
      label: 어떤 작품인가요
      description: 장르, 만든 기간, 혼자 만들었는지 같이 만들었는지, 스크린샷이나 GIF
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 받고 싶은 피드백
      placeholder: 예) 초반 5분이 지루한지 궁금해요
